<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<title>Kimchi Jjigae · K-Food Kitchen (Prototype)</title>
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --ink:#2B2118; --muted:#8A7A68;
    --accent:#BE3E27; --accent-ink:#FFFFFF; --line:#F0E4D3; --ok:#3E7C4F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    font-size:17px; line-height:1.55;}
  .topbar{display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 6px;}
  .brand{font-weight:800; letter-spacing:.12em; font-size:.8rem;}
  .proto{font-size:.68rem; font-weight:700; color:var(--accent);
    border:1.5px solid var(--accent); border-radius:999px; padding:2px 8px;}
  main{padding:6px 18px 120px; max-width:640px; margin:0 auto;}
  h1{font-size:2rem; line-height:1.15; margin:.35em 0 .1em;}
  .subtitle{color:var(--muted); font-size:1rem; margin:0 0 14px;}
  .dish-img{width:100%; height:auto; border-radius:18px; display:block;
    box-shadow:0 6px 24px rgba(90,50,20,.12);}
  .story{font-size:1.02rem; margin:18px 0 4px;}
  .meta{display:flex; gap:8px; margin:16px 0 4px;}
  .meta .cell{flex:1; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:10px 6px; text-align:center;}
  .meta .k{font-size:.68rem; letter-spacing:.08em; color:var(--muted); font-weight:700;}
  .meta .v{font-size:1.05rem; font-weight:800; margin-top:2px;}
  h2{font-size:1.25rem; margin:30px 0 6px;}
  .serve-row{display:flex; align-items:center; gap:12px; margin:10px 0 6px;}
  .serve-btn{width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--card); font-size:1.6rem; font-weight:800; color:var(--accent);
    cursor:pointer; touch-action:manipulation;}
  .serve-btn:active{transform:scale(.94);}
  .serve-num{font-size:1.5rem; font-weight:800; min-width:110px; text-align:center;}
  .serve-hint{color:var(--muted); font-size:.85rem; margin:2px 0 10px;}
  ul.ings{list-style:none; margin:0; padding:0;}
  li.ing{display:flex; gap:12px; align-items:flex-start; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin:8px 0;
    cursor:pointer;}
  li.ing .box{flex:none; width:26px; height:26px; border-radius:8px; margin-top:1px;
    border:2px solid var(--line); color:var(--ok); font-weight:900; text-align:center;
    line-height:22px; font-size:1rem;}
  li.ing.done{opacity:.48;}
  li.ing.done .txt{text-decoration:line-through;}
  li.ing .note{color:var(--muted); font-size:.88em;}
  .ing-count{color:var(--muted); font-size:.85rem; margin-top:6px;}
  ol.steps{margin:6px 0 0; padding-left:1.3em;}
  ol.steps li{margin:10px 0;}
  .chip{display:inline-block; background:#FDECE6; color:var(--accent); font-weight:700;
    font-size:.75rem; border-radius:999px; padding:2px 9px; margin-left:8px; vertical-align:2px;}
  .tips{background:#FFF3D6; border:1px solid #F3DFAC; border-radius:16px; padding:14px 16px;}
  .tips h3{margin:0 0 6px; font-size:1rem;}
  .tips ul{margin:6px 0 2px; padding-left:1.15em;}
  .tips li{margin:7px 0;}
  .cta{position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, var(--bg) 30%);}
  .cta button{width:100%; min-height:58px; border:none; border-radius:16px;
    background:var(--accent); color:var(--accent-ink); font-size:1.15rem; font-weight:800;
    cursor:pointer; touch-action:manipulation;}
  /* cook mode */
  .cook{position:fixed; inset:0; background:var(--bg); z-index:10; display:none;
    flex-direction:column; padding:18px 18px calc(14px + env(safe-area-inset-bottom));}
  .cook.open{display:flex;}
  .cook .progress{color:var(--muted); font-weight:700; letter-spacing:.06em; font-size:.8rem;}
  .cook .bar{height:6px; background:var(--line); border-radius:99px; margin:10px 0 22px; overflow:hidden;}
  .cook .bar i{display:block; height:100%; background:var(--accent); width:0%;}
  .cook .step-text{font-size:1.55rem; line-height:1.5; font-weight:600; flex:1;}
  .timer-box{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px; text-align:center; margin-bottom:14px;}
  .timer-display{font-size:2.4rem; font-weight:800; font-variant-numeric:tabular-nums;}
  .timer-display.done{color:var(--accent);}
  .timer-btns{display:flex; gap:8px; justify-content:center; margin-top:8px;}
  .timer-btns button{min-height:48px; padding:0 20px; border-radius:12px; cursor:pointer;
    border:1.5px solid var(--line); background:var(--bg); font-size:1rem; font-weight:700;
    touch-action:manipulation;}
  .cook .nav{display:flex; gap:10px;}
  .cook .nav button{flex:1; min-height:58px; border-radius:16px; font-size:1.1rem;
    font-weight:800; cursor:pointer; touch-action:manipulation;}
  .btn-prev{background:var(--card); border:1.5px solid var(--line); color:var(--ink);}
  .btn-next{background:var(--accent); border:none; color:var(--accent-ink);}
  .btn-exit{background:none; border:none; color:var(--muted); font-weight:700;
    min-height:44px; cursor:pointer;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">K-FOOD KITCHEN</div>
  <div class="proto">PROTOTYPE</div>
</div>

{"base_servings":2,"category":"soups-stews","cook_minutes":25,"id":"kimchi-jjigae","illustration":"assets/illust/kimchi-jjigae.webp","ingredients":[{"name":{"en":"well-fermented kimchi, roughly chopped","kr":"신김치"},"note":{"en":"the sourer, the better"},"quantity":2,"unit":"cups"},{"name":{"en":"pork belly, cut into bite-size pieces","kr":"삼겹살"},"quantity":8,"unit":"oz"},{"name":{"en":"firm tofu, sliced into thick pieces","kr":"두부"},"note":{"en":"about half a standard block"},"quantity":7,"unit":"oz"},{"name":{"en":"water or anchovy-kelp broth","kr":"물 또는 멸치육수"},"quantity":2,"unit":"cups"},{"name":{"en":"yellow onion, sliced","kr":"양파"},"quantity":0.5,"unit":""},{"name":{"en":"garlic, minced","kr":"마늘"},"quantity":3,"unit":"cloves"},{"name":{"en":"gochugaru (Korean chili flakes)","kr":"고춧가루"},"quantity":1,"unit":"tbsp"},{"name":{"en":"soy sauce","kr":"간장"},"quantity":1,"unit":"tbsp"},{"name":{"en":"sugar","kr":"설탕"},"quantity":1,"unit":"tsp"},{"name":{"en":"toasted sesame oil","kr":"참기름"},"note":{"en":"for finishing, not cooking"},"quantity":1,"unit":"tsp"},{"name":{"en":"green onions, chopped","kr":"대파"},"quantity":2,"unit":"stalks"}],"prep_minutes":15,"text":{"en":{"mistakes":["Using fresh kimchi. Fresh kimchi makes a flat, sad stew. You want the sour, funky stuff that's been sitting in the fridge a while — the older, the better.","Skipping the stir-fry. If you dump everything into water at once, you get kimchi soup. Frying the kimchi in pork fat first is where all the depth comes from.","Forgetting the sesame oil at the end. One teaspoon drizzled on right before serving changes the whole aroma. Don't cook it — just finish with it."],"steps":[{"text":"Heat a heavy pot over medium heat. Add the pork belly and kimchi and stir-fry until the kimchi softens and the pork loses its raw color, about 5 minutes. This step builds the base flavor, so don't rush it.","timer_minutes":5},{"text":"Pour in the water or broth. Stir in the gochugaru, soy sauce, sugar, garlic, and onion. Bring it to a rolling boil, then lower the heat to a steady simmer.","timer_minutes":10},{"text":"Lay the tofu slices gently on top. Spoon hot broth over them and simmer just until the tofu is heated through, so it doesn't break apart.","timer_minutes":5},{"text":"Taste and adjust: more soy sauce if it needs salt, a pinch of sugar if it's too sharp. Drizzle the sesame oil over the top, scatter the green onions, and serve it bubbling with a bowl of rice."}],"story":"Kimchi jjigae was the first Korean dish I ever tried to cook, mostly because a YouTube thumbnail made it look foolproof. It was not. My first pot tasted like hot kimchi water. The fix turned out to be stupidly simple: the kimchi has to be properly sour, and the pork fat has to melt into the broth. Now it's the stew I make when I don't want to think.","title":"Kimchi Jjigae","title_sub":"김치찌개 · Kimchi Stew"}}}

      var qty = fmtQty(ing.quantity === null ? null : ing.quantity * factor);
      var unit = ing.unit ? " " + ing.unit : "";
      var note = (ing.note && ing.note.en) ? ' <span class="note">(' + ing.note.en + ")</span>" : "";
      var done = checked[i] ? " done" : "";
      var mark = checked[i] ? "✓" : "";
      html += '<li class="ing' + done + '" data-i="' + i + '"><span class="box">' + mark +
              '</span><span class="txt"><strong>' + qty + unit + "</strong> " + ing.name.en + note + "</span></li>";
    });
    $("ings").innerHTML = html;
    var n = 0; for (var k in checked) if (checked[k]) n++;
    $("ing-count").textContent = n + " of " + R.ingredients.length + " ingredients ready";
    $("serve-num").textContent = servings + (servings === 1 ? " serving" : " servings");
  }

  $("ings").addEventListener("click", function(e){
    var li = e.target.closest("li.ing");
    if (!li) return;
    var i = li.getAttribute("data-i");
    checked[i] = !checked[i];
    try { localStorage.setItem("kf-checked-" + R.id, JSON.stringify(checked)); } catch(err) {}
    renderIngredients();
  });

  $("serve-minus").addEventListener("click", function(){ if (servings > 1) { servings--; renderIngredients(); } });
  $("serve-plus").addEventListener("click", function(){ if (servings < 8) { servings++; renderIngredients(); } });

  /* cook mode */
  var stepIdx = 0, wakeLock = null;
  var timer = { total: 0, remaining: 0, endsAt: 0, running: false, handle: null };
  var audioCtx = null;

  function beep(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var t = audioCtx.currentTime;
      [0, 0.35, 0.7].forEach(function(off){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.001, t + off);
        g.gain.exponentialRampToValueAtTime(0.4, t + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.3);
        o.start(t + off); o.stop(t + off + 0.32);
      });
    } catch(e) {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  function drawTimer(){
    var s = Math.max(0, Math.ceil(timer.remaining));
    var m = Math.floor(s / 60), r = s % 60;
    var el = $("timer-display");
    el.textContent = m + ":" + (r < 10 ? "0" : "") + r;
    el.className = "timer-display" + (timer.total > 0 && timer.remaining <= 0 ? " done" : "");
    $("timer-toggle").textContent = timer.running ? "Pause" : (timer.remaining < timer.total ? "Resume" : "Start timer");
  }
  function stopTimer(){
    timer.running = false;
    if (timer.handle) { clearInterval(timer.handle); timer.handle = null; }
  }
  function setTimer(minutes){
    stopTimer();
    timer.total = timer.remaining = minutes * 60;
    drawTimer();
  }
  $("timer-toggle").addEventListener("click", function(){
    if (timer.running) {
      timer.remaining = Math.max(0, (timer.endsAt - Date.now()) / 1000);
      stopTimer(); drawTimer(); return;
    }
    if (timer.remaining <= 0) timer.remaining = timer.total;
    timer.endsAt = Date.now() + timer.remaining * 1000;
    timer.running = true;
    timer.handle = setInterval(function(){
      timer.remaining = Math.max(0, (timer.endsAt - Date.now()) / 1000);
      if (timer.remaining <= 0) { stopTimer(); drawTimer(); beep(); }
      else drawTimer();
    }, 200);
    drawTimer();
  });
  $("timer-reset").addEventListener("click", function(){ setTimer(timer.total / 60); });

  function showStep(i){
    stepIdx = Math.max(0, Math.min(T.steps.length - 1, i));
    var step = T.steps[stepIdx];
    $("cook-progress").textContent = "STEP " + (stepIdx + 1) + " OF " + T.steps.length;
    $("cook-bar").style.width = ((stepIdx + 1) / T.steps.length * 100) + "%";
    $("cook-text").textContent = step.text;
    $("cook-prev").style.visibility = stepIdx === 0 ? "hidden" : "visible";
    $("cook-next").textContent = stepIdx === T.steps.length - 1 ? "Done ✓" : "Next →";
    if (step.timer_minutes) { $("timer-box").style.display = "block"; setTimer(step.timer_minutes); }
    else { $("timer-box").style.display = "none"; stopTimer(); }
    window.scrollTo(0, 0);
  }

  async function keepAwake(on){
    try {
      if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen");
      else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch(e) {}
  }

  $("start-cooking").addEventListener("click", function(){
    $("cook").classList.add("open");
    showStep(0);
    keepAwake(true);
  });
  $("cook-exit").addEventListener("click", function(){
    $("cook").classList.remove("open");
    stopTimer(); keepAwake(false);
  });
  $("cook-prev").addEventListener("click", function(){ showStep(stepIdx - 1); });
  $("cook-next").addEventListener("click", function(){
    if (stepIdx === T.steps.length - 1) {
      $("cook").classList.remove("open");
      stopTimer(); keepAwake(false);
    } else showStep(stepIdx + 1);
  });
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && $("cook").classList.contains("open")) keepAwake(true);
  });

  /* init */
  $("title").textContent = T.title;
  $("subtitle").textContent = T.title_sub || "";
  $("story").textContent = T.story;
  $("prep").textContent = R.prep_minutes + " min";
  $("cooktime").textContent = R.cook_minutes + " min";
  $("base").textContent = R.base_servings + " servings";
  $("steps").innerHTML = T.steps.map(function(s){
    return "<li>" + s.text + (s.timer_minutes ? '<span class="chip">⏱ ' + s.timer_minutes + " min</span>" : "") + "</li>";
  }).join("");
  $("tips").innerHTML = T.mistakes.map(function(m){ return "<li>" + m + "</li>"; }).join("");
  renderIngredients();
})();
</script>
</body>
</html>
